<!DOCTYPE html>
<html>
<head>
    <title>Firestore Connection Test</title>
</head>
<body>
    <h1>Firestore Connection Test</h1>
    <button onclick="testConnection()">Test Connection</button>
    <div id="result"></div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getFirestore, collection, getDocs } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

        const firebaseConfig = {
            apiKey: "AIzaSyDyieQJJy6kjwJ4zmjm-6Bly1xnelLoAqM",
            authDomain: "atrum-sol.firebaseapp.com",
            projectId: "atrum-sol",
            storageBucket: "atrum-sol.firebasestorage.app",
            messagingSenderId: "341260674604",
            appId: "1:341260674604:web:0ecd42bc66910dfdd39389"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.testConnection = async function() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = 'Testing...';
            
            try {
                const querySnapshot = await getDocs(collection(db, 'projects'));
                resultDiv.innerHTML = `<p style="color: green;">✅ Success! Found ${querySnapshot.size} projects</p>`;
                console.log('Projects:', querySnapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
            } catch (error) {
                resultDiv.innerHTML = `<p style="color: red;">❌ Error: ${error.message}</p>`;
                console.error('Full error:', error);
            }
        };
    </script>
</body>
</html>
